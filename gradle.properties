# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=true

# Use Android Studio bundled JDK (Java 21) for Gradle
org.gradle.java.home=D\:\\android\\jbr
# Gradle user home (avoid Chinese username path issues)
org.gradle.user.home=D\:\\AndroidSDK\\projects\\QuickTodo\\.gradle-cache

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
# Disable daemon to avoid Java version detection issues
org.gradle.daemon=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# Disable daemon to avoid Java version detection issues
org.gradle.daemon=false
# When configured, the Configuration Cache allows you to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
org.gradle.caching=false
# 禁用 Gradle 源码下载（解决网络超时问题）
systemProp.gradle.internal.repository.source.download=false

# Kotlin daemon config: run in-process and redirect temp dir to project cache
kotlin.daemon.enabled=false
kotlin.daemon.client.unload=true
kotlin.compiler.execution.strategy=in-process
systemProp.java.io.tmpdir=D\:/AndroidSDK/projects/QuickTodo/.gradle-cache/tmp
